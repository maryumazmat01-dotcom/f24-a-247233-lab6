<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The shelf</title>
  <style>
    header {
      background-color: teal;
      color: white;
      padding: 15px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Topic 1: Header -->
  <header>
    <h1>Stationery</h1>
  </header>

  <!-- Topic 2: Status line -->
  <p id="status">Ready to load shelf.</p>

  <!-- Topic 2: Board section with cards and empty price spans -->
  <div id="board">
    <div class="card">Pen: <span id="pen"></span></div>
    <div class="card">Copy: <span id="copy"></span></div>
    <div class="card">Tea: <span id="tea"></span></div>
  </div>

  <!-- Topic 3: Till section (Loaded, Dearest, Sum starting at 0) -->
  <div id="till">
    <p>Loaded: <span id="loaded">0</span></p>
    <p>Dearest: <span id="dearest">0</span></p>
    <p>Sum: <span id="sum">0</span></p>
  </div>

  <!-- Topic 5: Load button -->
  <button id="load">Load the shelf</button>

  <!-- Topic 1: Footer -->
  <footer>
    <p>247233</p>
  </footer>

  <!-- JavaScript -->
  <script>
    async function loadShelf() {
      const btn = document.getElementById("load");
      const status = document.getElementById("status");

      // Topic 6: Change status text and disable button
      status.textContent = "Loading…";
      btn.disabled = true;

      try {
        // Topic 7: Request pen, copy, and tea in parallel so they arrive in one wait
        const [penRes, copyRes, teaRes] = await Promise.all([
          fetch("/pen"),
          fetch("/copy"),
          fetch("/tea")
        ]);

        const penText = await penRes.text();
        const copyText = await copyRes.text();
        const teaText = await teaRes.text();

        // Update card prices on the board
        document.getElementById("pen").textContent = penText;
        document.getElementById("copy").textContent = copyText;
        document.getElementById("tea").textContent = teaText;

        // Parse prices as numbers to calculate till values dynamically
        const pPen = Number(penText);
        const pCopy = Number(copyText);
        const pTea = Number(teaText);

        // Topic 8: Calculate Dearest, Sum, and update Till display
        document.getElementById("loaded").textContent = "3";
        document.getElementById("dearest").textContent = Math.max(pPen, pCopy, pTea);
        document.getElementById("sum").textContent = pPen + pCopy + pTea;
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    // Topic 5: Attach event listener
    document.getElementById("load").addEventListener("click", loadShelf);
  </script>

</body>
</html>
